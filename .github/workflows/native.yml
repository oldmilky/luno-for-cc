# Build the microphone sidecar for every target one VSIX carries.
#
# The binaries are built here and nowhere else: this repository ships no Rust
# toolchain expectation to anyone working on the TypeScript, and a recorder
# built on a developer's machine is a recorder nobody else can reproduce.
#
# `release.yml` runs this same matrix as its first job. This workflow exists so
# the binaries can be built and downloaded without cutting a tag.
name: native

on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            slot: win32-x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            slot: win32-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            slot: darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            slot: darwin-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            slot: linux-x64
          # A native arm64 runner rather than a cross build. Cross-compiling
          # needs ALSA's headers for arm64, which means rewriting the runner's
          # apt sources to reach ports.ubuntu.com — measured: without that,
          # `libasound2-dev:arm64` simply is not found.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            slot: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup target add ${{ matrix.target }}

      # ALSA's headers are what cpal builds against on Linux. Both Linux
      # targets build on their own architecture, so this is the whole of it.
      - name: Linux audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Build
        working-directory: native/luno-audio
        run: cargo build --release --target ${{ matrix.target }}

      - name: Collect
        shell: bash
        run: |
          slot="resources/audio/${{ matrix.slot }}"
          mkdir -p "$slot"
          src="native/luno-audio/target/${{ matrix.target }}/release/luno-audio"
          if [ -f "$src.exe" ]; then cp "$src.exe" "$slot/luno-audio.exe"; else cp "$src" "$slot/luno-audio"; fi
          ls -la "$slot"

      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ matrix.slot }}
          path: resources/audio/${{ matrix.slot }}/*
          if-no-files-found: error
