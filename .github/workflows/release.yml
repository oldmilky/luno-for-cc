# Cut a release from a tag.
#
# Nothing here publishes on a push to main: the trigger is a `v*` tag, so the
# act of tagging is the decision to ship. The gates run *before* either registry
# is touched, because a version number cannot be taken back — both marketplaces
# refuse a re-publish of one that already exists.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # The microphone recorders, one per target, built fresh for every release
  # rather than committed. A binary in git is a binary nobody can prove came
  # from the source beside it.
  native:
    uses: ./.github/workflows/native.yml

  publish:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every slot under one directory, laid out exactly as the extension
      # looks for them: resources/audio/<platform>-<arch>/luno-audio.
      - uses: actions/download-artifact@v4
        with:
          pattern: audio-*
          path: resources/audio
      - name: Name the slots
        run: |
          cd resources/audio
          for dir in audio-*; do mv "$dir" "${dir#audio-}"; done
          chmod +x */luno-audio 2>/dev/null || true
          ls -laR .

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install both halves
        run: bun run install:all

      # The tag is what people will quote in a bug report; package.json is what
      # the marketplaces index. A mismatch publishes a version nobody can name.
      - name: Tag and manifest must agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "tag v$TAG does not match package.json $MANIFEST" >&2
            exit 1
          fi
          echo "version=$MANIFEST" >> "$GITHUB_ENV"

      - name: Gates
        run: |
          bun run lint
          bun run test

      - name: Package
        run: bun run package

      # Open VSX first: it is the registry Cursor, VSCodium and Windsurf read,
      # and the one this extension's own users are on.
      #
      # The empty-token guard is not defensive programming — it is a measured
      # failure. Handed `-p ""`, ovsx falls through to an interactive prompt
      # ("Personal Access Token for namespace 'lunoweb':"), reads EOF on a
      # runner, and **exits 0**. v0.38.0 went green with nothing published.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT is empty — add it under Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          # `--skip-duplicate` so a rerun after a later step failed is a no-op
          # here rather than an error: the registry refuses a version it already
          # has, and that refusal would block the rerun from reaching the steps
          # that did not get to run.
          bunx ovsx publish "luno-for-cc-${{ env.version }}.vsix" \
            -p "$OVSX_PAT" --skip-duplicate

      # Ask the registry rather than the exit code. The publish step already
      # lied once — an empty token prompted, read EOF and exited 0 — so the
      # only proof is the version answering.
      #
      # `no-cache` and the cache-buster are load-bearing, not belt-and-braces:
      # open-vsx.org serves this API through a CDN that holds the pre-publish
      # 404 for about a minute, and the first version of this check failed a
      # release that had in fact published.
      - name: The registry has it
        run: |
          # grep over the raw JSON rather than a node one-liner: the previous
          # version of this check was a quoting hazard that died on its own
          # syntax and failed two releases that had published fine.
          # Twenty attempts, not ten: v1.1.0 published at 12:50:09 and this
          # check gave up at 12:52:45 on a version the registry did serve. The
          # CDN held its 404 for longer than the 150s the first window allowed,
          # and the false negative blocked the Marketplace publish behind it.
          for i in $(seq 1 20); do
            if curl -s -H "Cache-Control: no-cache" \
                 "https://open-vsx.org/api/lunoweb/luno-for-cc/latest?cb=$RANDOM$i" \
                 | grep -q "\"version\":\"${{ env.version }}\""; then
              echo "open-vsx.org serves ${{ env.version }}"
              exit 0
            fi
            sleep 15
          done
          echo "open-vsx.org still does not serve ${{ env.version }}" >&2
          exit 1

      # Skipped rather than failed when the secret is absent, so Open VSX can go
      # out before a Marketplace publisher exists.
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''
        run: >
          bunx @vscode/vsce publish
          --packagePath "luno-for-cc-${{ env.version }}.vsix"
          -p "$VSCE_PAT"

      # The same artifact both registries got, attached where someone who
      # cannot reach either can still download it.
      #
      # Idempotent on purpose: a tag re-pushed after a failed publish finds its
      # release already there, and `create` alone would fail the rerun on the
      # one step that had actually worked.
      - name: Attach the VSIX to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX: luno-for-cc-${{ env.version }}.vsix
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber
            # Deleting a tag turns its release into a draft, and re-cutting a
            # tag is exactly what happens while a release is being fixed. Left
            # alone, the artifact is there and nobody can see it.
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
