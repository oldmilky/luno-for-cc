# Cut a release from a tag.
#
# Nothing here publishes on a push to main: the trigger is a `v*` tag, so the
# act of tagging is the decision to ship. The gates run *before* either registry
# is touched, because a version number cannot be taken back — both marketplaces
# refuse a re-publish of one that already exists.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install both halves
        run: bun run install:all

      # The tag is what people will quote in a bug report; package.json is what
      # the marketplaces index. A mismatch publishes a version nobody can name.
      - name: Tag and manifest must agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "tag v$TAG does not match package.json $MANIFEST" >&2
            exit 1
          fi
          echo "version=$MANIFEST" >> "$GITHUB_ENV"

      - name: Gates
        run: |
          bun run lint
          bun run test

      - name: Package
        run: bun run package

      # Open VSX first: it is the registry Cursor, VSCodium and Windsurf read,
      # and the one this extension's own users are on.
      #
      # The empty-token guard is not defensive programming — it is a measured
      # failure. Handed `-p ""`, ovsx falls through to an interactive prompt
      # ("Personal Access Token for namespace 'lunoweb':"), reads EOF on a
      # runner, and **exits 0**. v0.38.0 went green with nothing published.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT is empty — add it under Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          bunx ovsx publish "luno-for-cc-${{ env.version }}.vsix" -p "$OVSX_PAT"

      # Ask the registry rather than the exit code. The step above already
      # lied once; the only proof of a publish is the version answering.
      - name: The registry has it
        run: |
          for i in 1 2 3 4 5 6; do
            FOUND=$(curl -sf "https://open-vsx.org/api/lunoweb/luno-for-cc/${{ env.version }}" \
              | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).version}catch{''}" || true)
            if [ "$FOUND" = "${{ env.version }}" ]; then
              echo "open-vsx.org serves ${{ env.version }}"
              exit 0
            fi
            sleep 10
          done
          echo "open-vsx.org does not serve ${{ env.version }} a minute after publishing" >&2
          exit 1

      # Skipped rather than failed when the secret is absent, so Open VSX can go
      # out before a Marketplace publisher exists.
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''
        run: >
          bunx @vscode/vsce publish
          --packagePath "luno-for-cc-${{ env.version }}.vsix"
          -p "$VSCE_PAT"

      # The same artifact both registries got, attached where someone who
      # cannot reach either can still download it.
      #
      # Idempotent on purpose: a tag re-pushed after a failed publish finds its
      # release already there, and `create` alone would fail the rerun on the
      # one step that had actually worked.
      - name: Attach the VSIX to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX: luno-for-cc-${{ env.version }}.vsix
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
